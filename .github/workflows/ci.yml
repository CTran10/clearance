name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: go test ./...

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run vet
        run: go vet ./...

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-local-placeholder
          TRANSACTION_API_AUTH_VALUE: ci-local-placeholder
        run: docker compose config >/dev/null
