name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearance
          POSTGRES_PASSWORD: clearance_ci
          POSTGRES_DB: clearance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearance -d clearance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_INTEGRATION_DATABASE_URL: postgresql+psycopg://clearance:clearance_ci@localhost:5432/clearance_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report
